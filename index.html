<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technická podpora – VDF Games</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome pro ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-glow"></div>
    
    <main class="container">
        <header class="header">
            <div class="logo">
                <i class="fa-solid fa-gamepad"></i>
                <span>VDF Games</span>
            </div>
            <h1>Technická podpora</h1>
            <p class="subtitle">Jak ti můžeme pomoct? Napiš, jaký máš problém.</p>
        </header>

        <form id="supportForm" class="card">
            <div class="form-group">
                <label for="query">Tvůj dotaz:</label>
                <textarea id="query" name="query" rows="4" placeholder="Popiš podrobně svůj problém..." required></textarea>
            </div>

            <div class="form-group">
                <label for="email">E-mail (nepovinné):</label>
                <input type="email" id="email" name="email" placeholder="napriklad@email.cz">
            </div>

            <button type="submit" id="submitBtn">
                <span>Odeslat dotaz</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <!-- Zpráva s okamžitou zpětnou vazbou -->
        <div id="feedbackMessage" class="feedback-banner hidden">
            <i class="fa-solid fa-circle-check"></i>
            <span>Děkujeme! Tvůj dotaz byl úspěšně odeslán.</span>
        </div>

        <!-- Sekce s odpovědí podpory -->
        <section class="card response-card">
            <h2>Odpověď podpory:</h2>
            <div id="responseBox" class="response-box empty">
                <p class="placeholder-text">Zatím nebyly odeslány žádné dotazy. Po odeslání se zde zobrazí potvrzení a simulovaná odpověď.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
